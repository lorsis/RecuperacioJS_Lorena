<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Mecánico - Sistema de Gestión</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="./css/font-awesome.all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/bootstrap.min.js"></script>
   

</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="fas fa-car"></i> Taller Mecánico - Sistema de Gestión
            </span>
            <button class="btn btn-outline-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
                <i class="fas fa-bars"></i> Menú
            </button>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menú Principal</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div class="list-group">
                <button class="list-group-item list-group-item-action">
                    <a href="./clientes.html" class="text-decoration-none text-dark">
                        <i class="fas fa-users"></i> Clientes
                    </a>
                </button>
                <button class="list-group-item list-group-item-action">
                    <a href="./coches.html" class="text-decoration-none text-dark">
                        <i class="fas fa-car"></i> Coches
                    </a>
                </button>
                <button class="list-group-item list-group-item-action">
                    <a href="./reservas.html" class="text-decoration-none text-dark">
                        <i class="fas fa-calendar-alt"></i> Reservas
                    </a>
                </button>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <!-- Sección Clientes -->
        <div id="seccionClientes" class="seccion">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-user-plus"></i> Registrar Cliente
                </div>
                <div class="card-body">
                    <form  novalidate id="formularioCliente">
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" >
                                
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="apellidos" class="form-label">Apellidos *</label>
                                <input type="text" class="form-control" id="apellidos">
                                
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="idCliente" class="form-label">NIF/NIE *</label>
                                <input type="text" class="form-control" id="idCliente" >
                                
                            </div>
                            <div class="col-md-2 mb-3">
                                <label for="telefono" class="form-label">Teléfono *</label>
                                <input type="tel" class="form-control" id="telefono">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" >
                            </div>
                            <div class="col-md-12">
                                <p class="text-danger" id="missatgeError"></p>
                                <button type="submit" class="btn btn-primary" id="guardarCliente">Guardar Cliente</button>
                            </div>
                            <p class="text-muted">* Campos obligatorios</p>
                            
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <i class="fas fa-list"></i> Lista de Clientes
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped" id="tablaClientes">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Apellidos</th>
                                    <th>Teléfono</th>
                                    <th>Email</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyClientes"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

   </body>
   </html>
